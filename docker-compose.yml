---
services:
  analytics:
    build:
      context: .
    image: analytics-server:local
    ports:
      - "3000:8000"
    environment:
      DATABASE_URL: sqlite:////data/analytics.db
      LOG_LEVEL: INFO
      MAX_CONTENT_LENGTH: "8192"
    volumes:
      - analytics-data:/data
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  analytics-data:
