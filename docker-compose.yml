---
services:
  offen:
    image: offen/offen:v1.4.2
    ports:
      - "3000:80"
    environment:
      OFFEN_DATABASE_DIALECT: sqlite3
      OFFEN_DATABASE_CONNECTIONSTRING: /var/opt/offen/offen.db
      OFFEN_SECRET: ${OFFEN_SECRET:?Set OFFEN_SECRET in .env}
    volumes:
      - offen-data:/var/opt/offen
    init: true
    restart: unless-stopped

volumes:
  offen-data:
